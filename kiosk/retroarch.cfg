# aPiStation overrides, loaded on top of the normal RetroArch config with --appendconfig.
# Games open full screen; Start + Select (held together) quits straight back to the console.

video_fullscreen = "true"
pause_nonactive = "false"
config_save_on_exit = "false"

# Controller
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_quit_gamepad_combo = "4"
input_menu_toggle_gamepad_combo = "2"
quit_press_twice = "false"

# Keyboard: Esc quits, F1 opens the RetroArch menu (defaults, kept explicit)
input_exit_emulator = "escape"
input_menu_toggle = "f1"

# Pick up where you left off
savestate_auto_save = "true"
savestate_auto_load = "true"

# No on-screen clutter on the TV
notification_show_autoconfig = "false"
notification_show_config_override_load = "false"
notification_show_remap_load = "false"
